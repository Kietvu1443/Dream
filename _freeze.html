<!DOCTYPE html>
<html><head><meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script></head>
<body>
<div id="app"></div>
<script src="game.js"></script>
<script>
/* COMPREHENSIVE FREEZE REPRODUCTION & REGRESSION TEST SUITE
 * 1. 74+ BUILD SUITE TESTS
 * 2. 33 REGRESSION TESTS
 * 3. PERK TRANSITION TESTS (7 PERKS)
 * 4. TRAIL TRANSITION TESTS (11 TRAILS)
 * 5. REWARD CLICK PATH & BUFF FLOW
 * 6. COMBINATIONS (PERK + 3 TRAILS)
 * 7. 2000-FRAME STRESS TEST
 * 8. RESTART & ZERO LEAK VALIDATION
 */
(function () {
  const L = []; const errors = [];
  window.addEventListener('error', (e) => errors.push('onerror: ' + e.message));
  const ce = console.error;
  console.error = function () { errors.push('console.error: ' + [].join.call(arguments, ' ')); ce.apply(console, arguments); };
  const log = (n, ok, x) => L.push((ok ? 'PASS  ' : 'FAIL  ') + n + (x !== undefined ? '  [' + x + ']' : ''));
  const assert = (n, c, x) => { log(n, !!c, x); return !!c; };
  const $ = (id) => document.getElementById(id);
  document.body.innerHTML = `
    <canvas id="game-canvas"></canvas>
    <div id="hud" class="hidden">
      <div id="crosshair"><span></span><span></span><span></span><span></span><span></span></div>
      <div id="hitmarker"><span></span><span></span><span></span><span></span></div>
      <div id="armor-flash"></div><div id="scope-overlay" class="hidden"></div>
      <div id="hud-topleft"><div id="hp-fill"></div><span id="hp-text"></span><div id="stamina-fill"></div>
        <div id="armor-helmet" class="armor-chip empty"></div><div id="armor-body" class="armor-chip empty"></div>
        <div id="armor-boots" class="armor-chip empty"></div><span id="armor-total"></span><div id="buff-list"></div></div>
      <div id="perk-hud" class="perk-hud hidden"></div>
      <div id="trail-list"></div><div id="synergy-list"></div>
      <div id="boss-bar" class="hidden"><div id="boss-name"></div><div id="boss-fill"></div><div id="boss-text"></div></div>
      <div id="pickup-prompt" class="hidden"></div>
      <div id="hud-topright"><span id="wave-value"></span><span id="layout-name"></span><span id="enemy-value"></span><span id="kills-value"></span></div>
      <div id="hud-bottomleft"><div id="weapon-name"></div><div id="weapon-mods"></div>
        <span id="ammo-mag"></span><span id="ammo-reserve"></span><span id="ammo-type"></span>
        <div id="reload-hint" class="hidden"></div></div>
      <div id="weapon-slots"><div class="slot"><b>1</b><span></span></div><div class="slot"><b>2</b><span></span></div>
        <div class="slot"><b>3</b><span></span></div></div>
      <div id="dash-status" class="ready">DASH</div>
      <div id="damage-vignette"></div><div id="damage-direction-layer"></div><div id="directional-damage"></div><div id="low-hp-pulse"></div>
      <div id="wave-banner"></div><div id="intermission"></div><div id="damage-numbers"></div><div id="buff-toast"></div>
      <div id="perk-vignette" class="perk-vignette"></div>
      <div id="executioner-visor" class="executioner-visor hidden">
        <div class="visor-frame">
          <div class="visor-bracket vb-tl"></div><div class="visor-bracket vb-tr"></div>
          <div class="visor-bracket vb-bl"></div><div class="visor-bracket vb-br"></div>
          <div class="visor-header"><span class="vh-tag">EXECUTIONER OPTICS</span><span id="visor-durability-text" class="vh-dur">MASK: 100%</span></div>
          <div class="visor-bar"><div id="visor-durability-fill" style="width:100%"></div></div>
          <div id="visor-repair-box" class="visor-repair hidden">REPAIRING OPTICS: <b id="visor-repair-time">22s</b></div>
          <div id="visor-cracks" class="visor-cracks"></div>
        </div>
        <div class="visor-scanlines"></div>
      </div>
      <div id="mask-break-overlay" class="mask-break-overlay hidden">
        <div class="mbo-darkness"></div><div class="mbo-glitch-lines"></div>
        <div class="mbo-content"><div class="mbo-icon">⚠</div><div class="mbo-title">TAKE OFF MASK</div>
        <div class="mbo-sub">OPTICAL COMPONENT SHATTERED // SYSTEM CRITICAL</div></div>
      </div>
      <div id="perk-action-toast" class="perk-action-toast hidden"></div>
    </div>
    <div id="inventory" class="screen hidden"><div id="inv-armor"></div><div id="inv-weapons"></div>
      <div id="inv-ammo"></div><div id="inv-build"></div></div>
    <div id="reward-screen" class="screen hidden"><div id="reward-title"></div><div id="reward-cards"></div></div>
    <div id="menu-main" class="screen"></div><div id="menu-controls" class="screen hidden"></div>
    <div id="menu-pause" class="screen hidden"></div>
    <div id="menu-gameover" class="screen hidden"><span id="rs-wave"></span><span id="rs-kills"></span><span id="rs-acc"></span></div>
    <div id="menu-loading" class="screen"><p id="loading-status"></p></div>`;

  const g = new window.StrikeProtocol.Game();
  const SP = window.StrikeProtocol;
  const P = g.player;
  let updates = 0;
  function frame() {
    if (g.state === 'playing' || g.state === 'dead') { g._update(1 / 60); updates++; }
    g.input.endFrame();
  }
  const frames = (n) => { for (let i = 0; i < n; i++) frame(); };

  function flow(label, kind, def) {
    g.startGame();
    P.invuln = 1e7;
    g.waveManager.state = 'playing';
    g.waveManager.wave = 1;
    g.enemies.slice().forEach(e => e.takeDamage(999999, new THREE.Vector3(0, 0, 1), false, g));
    g.onStageCleared(false);
    const before = g.state;
    const hadCards = !!g.ui._rewardOptions;
    g._applyReward({ kind: kind, def: def });
    const after = g.state;
    const overlaysClosed = $('reward-screen').classList.contains('hidden');
    updates = 0;
    frames(300);
    const ok = after === 'playing' && updates > 200 && overlaysClosed;
    log((ok ? 'PASS  ' : 'FAIL  ') + label,
      before === 'reward' && hadCards && ok,
      'before=' + before + ' after=' + after + ' updates=' + updates + ' overlayHidden=' + overlaysClosed);
    return ok;
  }

  try {
    /* =========================================================================
     * 1. BUILD SUITE (74+ tests)
     * ========================================================================= */
    let bCount = 0;
    function bTest(name, cond, detail) {
      bCount++;
      assert('BUILD ' + bCount + ': ' + name, !!cond, detail);
    }

    // 1-7: Perk defs
    SP.PERKS.forEach(p => bTest('Perk ' + p.name + ' def valid', p.id && p.name && p.cd > 0 && typeof p.update === 'function', p.id));
    // 8-18: Trail defs
    SP.TRAILS.forEach(t => bTest('Trail ' + t.name + ' def valid', t.id && t.name && typeof t.init === 'function' && typeof t.mods === 'function' && typeof t.status === 'function', t.id));
    // 19-25: Synergies
    SP.SYNERGIES.forEach(s => bTest('Synergy ' + s.name + ' def valid', s.id && s.a && s.b && s.name && s.desc, s.id));
    // 26: Initial build state
    g.build.reset();
    bTest('Build starts clean', g.build.perk === null && g.build.trailCount() === 0, 'trails=' + g.build.trailCount());
    // 27-33: equipPerk
    SP.PERKS.forEach(p => {
      g.build.equipPerk(p.id);
      bTest('equipPerk ' + p.name, g.build.perk && g.build.perk.id === p.id && g.build.perkState !== null, g.build.perk.id);
    });
    // 34-44: equipTrail
    g.build.reset();
    SP.TRAILS.forEach(t => {
      g.build.equipTrail(t.id, 0);
      bTest('equipTrail ' + t.name, g.build.hasTrail(t.id) && g.build.trailState[0] !== null, t.id);
      g.build.removeTrail(0);
    });
    // 45: trailCount
    g.build.reset();
    g.build.equipTrail('hunter', 0);
    g.build.equipTrail('momentum', 1);
    bTest('trailCount equals 2', g.build.trailCount() === 2, g.build.trailCount());
    // 46: hasTrail check
    bTest('hasTrail hunter is true', g.build.hasTrail('hunter') === true, 'hunter');
    bTest('hasTrail predator is false', g.build.hasTrail('predator') === false, 'predator');
    // 47: removeTrail
    g.build.removeTrail(1);
    bTest('removeTrail clears slot', g.build.trails[1] === null && g.build.trailCount() === 1, g.build.trailCount());
    // 48: removePerk & turret cleanup
    g.build.equipPerk('engineer');
    g.activatePerk();
    const hadTurret = !!g.build.perkState.turret;
    g.build.removePerk();
    bTest('removePerk clears perk and cleans turret', g.build.perk === null && g.build.perkState === null, 'hadTurret=' + hadTurret);
    // 49: slot replacement when full
    g.build.reset();
    g.build.equipTrail('hunter', 0);
    g.build.equipTrail('momentum', 1);
    g.build.equipTrail('adrenaline', 2);
    g.build.equipTrail('survival');
    bTest('equipTrail replaces slot 0 when full', g.build.trails[0].id === 'survival' && g.build.trailCount() === 3, g.build.trails.map(x=>x.id).join(','));
    // 50-56: Perk status finiteness
    SP.PERKS.forEach(p => {
      g.build.equipPerk(p.id);
      const st = g.build.perkStatus();
      bTest('Perk status finite ' + p.name, typeof st.label === 'string' && typeof st.text === 'string' && Number.isFinite(st.bar), st.text);
    });
    // 57-67: Trail status finiteness
    SP.TRAILS.forEach((t) => {
      g.build.equipTrail(t.id, 0);
      const s = g.build.trailState[0];
      const st = t.status(s);
      bTest('Trail status finite ' + t.name, typeof st.text === 'string' && typeof st.on === 'boolean', st.text);
    });
    // 68-71: combineMods and resolveStats
    const cmEmpty = SP.combineMods([]);
    bTest('combineMods empty returns valid structure', cmEmpty.mul && cmEmpty.add, JSON.stringify(cmEmpty));
    const cmCombined = SP.combineMods([{ mul: { damage: 1.2 }, add: { health: 10 } }, { mul: { damage: 1.1 } }]);
    bTest('combineMods multiplies mul and adds add', Math.abs(cmCombined.mul.damage - 1.32) < 0.001 && cmCombined.add.health === 10, cmCombined.mul.damage);
    const rs = SP.resolveStats({ damage: 20 }, cmCombined);
    bTest('resolveStats calculates expected result', Math.abs(rs.damage - 26.4) < 0.01, rs.damage);
    const rsSafe = SP.resolveStats({ damage: 20 }, null);
    bTest('resolveStats handles null mods safely', rsSafe.damage === 20, rsSafe.damage);
    // 72-79: BUILD_CAPS checks
    bTest('BUILD_CAPS moveSpeed <= 2.1', SP.BUILD_CAPS.moveSpeed === 2.1, SP.BUILD_CAPS.moveSpeed);
    bTest('BUILD_CAPS damage <= 4.0', SP.BUILD_CAPS.damage === 4.0, SP.BUILD_CAPS.damage);
    bTest('BUILD_CAPS fireRate <= 2.6', SP.BUILD_CAPS.fireRate === 2.6, SP.BUILD_CAPS.fireRate);
    bTest('BUILD_CAPS damageReduction <= 0.80', SP.BUILD_CAPS.damageReduction === 0.80, SP.BUILD_CAPS.damageReduction);
    bTest('BUILD_CAPS healPerSec <= 40', SP.BUILD_CAPS.healPerSec === 40, SP.BUILD_CAPS.healPerSec);
    bTest('BUILD_CAPS dogtag <= 10', SP.BUILD_CAPS.dogtag === 10, SP.BUILD_CAPS.dogtag);
    bTest('BUILD_CAPS heat <= 100', SP.BUILD_CAPS.heat === 100, SP.BUILD_CAPS.heat);
    bTest('BUILD_CAPS trails <= 3', SP.BUILD_CAPS.trails === 3, SP.BUILD_CAPS.trails);
    // 80-86: Synergies recognized and flags active
    g.build.reset();
    g.build.equipTrail('impatient', 0); g.build.equipTrail('momentum', 1);
    bTest('Synergy impatient_momentum recognized', g.build.hasSynergy('impatient_momentum'), 'impatient_momentum');
    g.build.reset();
    g.build.equipTrail('survival', 0); g.build.equipTrail('guardian', 1);
    bTest('Synergy survival_guardian recognized', g.build.hasSynergy('survival_guardian'), 'bulwark');
    g.build.reset();
    g.build.equipTrail('hunter', 0); g.build.equipTrail('bloodlust', 1);
    bTest('Synergy hunter_bloodlust recognized', g.build.hasSynergy('hunter_bloodlust'), 'pack hunt');
    g.build.reset();
    g.build.equipPerk('fireman'); g.build.equipTrail('survival', 0);
    bTest('Synergy fireman_survival recognized', g.build.hasSynergy('fireman_survival'), 'flammable');
    g.build.reset();
    g.build.equipPerk('samurai'); g.build.equipTrail('impatient', 0);
    bTest('Synergy samurai_impatient caps dogtags at 6', g.build.dogtagCap() === 6, g.build.dogtagCap());
    g.build.reset();
    g.build.equipPerk('phantom'); g.build.equipTrail('momentum', 0);
    bTest('Synergy phantom_momentum recognized', g.build.hasSynergy('phantom_momentum'), 'ghoststep');
    g.build.reset();
    g.build.equipPerk('medic'); g.build.equipTrail('survival', 0);
    bTest('Synergy medic_survival recognized', g.build.hasSynergy('medic_survival'), 'sustain');
    // 87-90: Pipeline finiteness with all perks and trails
    let allFinite = true;
    SP.PERKS.forEach(p => {
      g.build.equipPerk(p.id);
      g.build.update(1/60);
      for (const k in P.stats) if (typeof P.stats[k] === 'number' && !Number.isFinite(P.stats[k])) allFinite = false;
    });
    bTest('Stat pipeline 0 NaN 0 Infinity with perks', allFinite, 'allFinite');
    g.build.reset();
    g.build.equipTrail('hunter', 0); g.build.equipTrail('momentum', 1); g.build.equipTrail('adrenaline', 2);
    g.build.update(1/60);
    let trailsFinite = true;
    for (const k in P.stats) if (typeof P.stats[k] === 'number' && !Number.isFinite(P.stats[k])) trailsFinite = false;
    bTest('Stat pipeline 0 NaN 0 Infinity with 3 trails', trailsFinite, 'trailsFinite');

    /* =========================================================================
     * 2. REGRESSION SUITE (33 tests)
     * ========================================================================= */
    let rCount = 0;
    function rTest(name, cond, detail) {
      rCount++;
      assert('REGRESSION ' + rCount + ': ' + name, !!cond, detail);
    }
    g.startGame();
    // 1: Player spawned alive with full HP & stamina
    rTest('Player spawns alive with full HP', P.alive && P.health === P.maxHealth && P.stamina > 0, 'hp=' + P.health);
    // 2: Default loadout
    rTest('Default loadout has 2 weapons', P.slots[0] && P.slots[1] && !P.slots[2], P.slots.map(s=>s?s.id:'null').join(','));
    // 3: Current weapon slot
    rTest('Current weapon starts at slot 0', P.current === 0 && P.weapon !== null, 'slot=' + P.current);
    // 4: Weapon slot switch 1
    P.switchTo(1);
    rTest('Switch to slot 1', P.current === 1 && P.weapon.inst.typeId === 'pump', P.weapon.inst.typeId);
    // 5: Weapon slot switch back to 0
    P.weapon.switching = 0;
    P.switchTo(0);
    rTest('Switch back to slot 0', P.current === 0 && P.weapon.inst.typeId === 'ar15', P.weapon.inst.typeId);
    // 6: Weapon firing consumes magazine ammo
    const w = P.weapon;
    w.switching = 0;
    const mag0 = w.mag;
    w.fire(g);
    rTest('Weapon shoot consumes magazine ammo', w.mag < mag0, 'mag=' + w.mag + '/' + mag0);
    // 7: Weapon reload restores magazine
    w.startReload(g.audio);
    w._finishReload();
    rTest('Weapon reload fills magazine', w.mag === w.stats.magazine, 'mag=' + w.mag);
    // 8: Weapon stats calculation
    rTest('Weapon stats finite', Number.isFinite(w.stats.damage) && Number.isFinite(w.stats.fireRate) && Number.isFinite(w.stats.spread), w.stats.damage);
    // 9: LootSystem creation
    const lootItem = g.loot.create(1, 0, null, 1);
    rTest('LootSystem generates WeaponInstance', lootItem instanceof SP.WeaponInstance && lootItem.rarity !== null, lootItem.rarity.name);
    // 10: Ammo pool tracking
    const ammo556 = P.ammoPool('5.56');
    P.addAmmo('5.56', 30);
    rTest('Ammo pool increments', P.ammoPool('5.56') === ammo556 + 30, 'ammo=' + P.ammoPool('5.56'));
    // 11: Armor equipping and armorValue
    const armorItem = new SP.ArmorInstance('helmet', 'uncommon');
    P.armor.helmet = armorItem;
    P.refreshArmor();
    rTest('Armor value updates on helmet equip', P.armorValue() > 0, 'armor=' + P.armorValue());
    // 12: Armor damage absorption
    P.invuln = 0;
    const pool0 = P.armorPool();
    P.damage(10, new THREE.Vector3(0,0,0), false);
    rTest('Armor absorbs damage', P.armorPool() < pool0, 'pool=' + P.armorPool());
    // 13: Player takes damage and survives
    P.invuln = 0;
    const hp0 = P.health;
    P.damage(50, new THREE.Vector3(0,0,0), false);
    rTest('Player survives non-fatal damage', P.alive && P.health < hp0, 'hp=' + P.health);
    // 14: Player heal restores health
    const hpDamaged = P.health;
    P.heal(10);
    rTest('Player heal increases HP', P.health > hpDamaged, 'hp=' + P.health);
    // 15: Fatal damage kills player
    P.invuln = 0;
    P.damage(999999, new THREE.Vector3(0,0,0), false);
    rTest('Fatal damage kills player', !P.alive, 'alive=' + P.alive);
    // 16: Player respawn restores life
    P.respawn();
    rTest('Player respawn restores full life', P.alive && P.health === P.maxHealth, 'hp=' + P.health);
    // 17: Planar movement from input
    g.input.keys['KeyW'] = true;
    P.update(0.1, g.input);
    g.input.keys['KeyW'] = false;
    rTest('Player movement updates velocity', P.velocity.lengthSq() >= 0, 'vel=' + P.velocity.length());
    // 18: Sprinting drains stamina
    g.input.keys['KeyW'] = true;
    g.input.keys['ShiftLeft'] = true;
    P.grounded = true;
    const st0 = P.stamina;
    P.update(0.1, g.input);
    g.input.keys['ShiftLeft'] = false;
    g.input.keys['KeyW'] = false;
    rTest('Sprint consumes stamina', P.stamina < st0, 'stamina=' + P.stamina);
    // 19: Stamina regen when resting
    P.sprinting = false;
    P.staminaLock = 0;
    P.update(0.1, g.input);
    rTest('Stamina regens', P.stamina > 0, 'stamina=' + P.stamina);
    // 20: Dash mechanic
    P.dashCd = 0;
    const dashed = P.tryDash(0, 1);
    rTest('Dash triggers cooldown', dashed && P.dashCd > 0, 'dashCd=' + P.dashCd);
    // 21: ADS spread reduction
    const hipSpread = P.currentSpreadBonus();
    P.adsAmt = 1;
    const adsSpread = P.currentSpreadBonus();
    rTest('ADS reduces spread bonus', adsSpread < hipSpread, 'ads=' + adsSpread + ' hip=' + hipSpread);
    P.adsAmt = 0;
    // 22: Lean offset
    P.leanAmt = 1;
    P._updateCamera(0.016);
    rTest('Lean adjusts camera roll', Number.isFinite(P.camRoll), 'camRoll=' + P.camRoll);
    P.leanAmt = 0;
    // 23: WaveManager initial state
    rTest('WaveManager initialized', g.waveManager.wave >= 0, 'wave=' + g.waveManager.wave);
    // 24: WaveManager composition
    const comp1 = g.waveManager.composition(1);
    rTest('WaveManager comp wave 1 has grunts', comp1.length > 0 && comp1.includes('grunt'), comp1.join(','));
    // 25: Boss stage detection (wave 5)
    rTest('Wave 5 is boss wave', g.waveManager.isBossStage(5) === true && g.waveManager.isBossStage(1) === false, 'isBoss');
    // 26: Enemy spawning and state
    g.waveManager.queue = ['grunt', 'grunt'];
    g.waveManager._spawnOne();
    rTest('WaveManager startWave sets spawning queue', g.enemies.length > 0, 'enemies=' + g.enemies.length);
    // 27: Enemy instance attributes
    const testEnemy = g.enemies[g.enemies.length - 1];
    rTest('Enemy spawns alive with hitboxes', testEnemy.alive && testEnemy.hp > 0 && testEnemy.hitBody !== null, 'hp=' + testEnemy.hp);
    // 28: Enemy takeDamage
    const eHp0 = testEnemy.hp;
    testEnemy.takeDamage(20, new THREE.Vector3(0, 0, 1), false, g);
    rTest('Enemy takes damage', testEnemy.hp < eHp0, 'hp=' + testEnemy.hp);
    // 29: Enemy fatal damage
    testEnemy.takeDamage(999999, new THREE.Vector3(0, 0, 1), false, g);
    rTest('Enemy dies on fatal damage', !testEnemy.alive, 'alive=' + testEnemy.alive);
    // 30: Game statistics tracking
    rTest('Game stats tracking numbers finite', Number.isFinite(g.stats.kills) && Number.isFinite(g.stats.shots), 'kills=' + g.stats.kills);
    // 31: Pause and resume states
    g.state = 'playing';
    g.pause();
    const pausedOk = g.state === 'paused';
    g.resume();
    rTest('Pause and resume state transitions', pausedOk && g.state === 'playing', 'pausedOk=' + pausedOk + ' resumed=' + g.state);
    // 32: Inventory state transition
    const open1 = g.ui.toggleInventory();
    g.state = open1 ? 'inventory' : 'playing';
    const invOpenOk = g.state === 'inventory';
    const open2 = g.ui.toggleInventory();
    g.state = open2 ? 'inventory' : 'playing';
    rTest('Inventory opens and closes', invOpenOk && g.state === 'playing', 'invOpen=' + invOpenOk + ' resumed=' + g.state);
    // 33: Arena layout application
    g.arena.applyLayout(0, 1);
    rTest('Arena applies layout safely', g.arena.layoutIndex === 0 && g.arena.spawnPoints.length > 0, 'spawns=' + g.arena.spawnPoints.length);

    /* =========================================================================
     * 3. PERK FLOW (7 perks)
     * ========================================================================= */
    const perks = ['fireman', 'samurai', 'executioner', 'phantom', 'medic', 'gravity', 'engineer'];
    for (const id of perks) {
      const def = SP.PERK_BY_ID[id];
      const ok = flow('perk flow: ' + def.name, 'perk', def);
      if (ok) {
        frames(120);
        log('     ' + def.name + ' updates during next stage: ' + updates,
          updates > 300 && g.state === 'playing');
      }
    }

    /* =========================================================================
     * 4. TRAIL FLOW (11 trails)
     * ========================================================================= */
    const trails = ['impatient', 'survival', 'hunter', 'berserker', 'scavenger', 'momentum',
      'bloodlust', 'guardian', 'predator', 'adrenaline', 'tactician'];
    for (const id of trails) {
      const def = SP.TRAIL_BY_ID[id];
      flow('trail flow: ' + def.name, 'trail', def);
    }

    /* =========================================================================
     * 5. BUFF FLOW & REAL CLICK PATH
     * ========================================================================= */
    flow('buff flow: Berserker', 'buff', SP.BUFFS[0]);

    g.startGame();
    g.waveManager.state = 'playing'; g.waveManager.wave = 1;
    g.onStageCleared(false);
    let guard = 0;
    while (!g.ui._rewardOptions && guard++ < 20) g._offerReward(false);
    const opts = g.ui._rewardOptions || [];
    const idx = opts.findIndex(o => o.kind === 'trail' || o.kind === 'perk');
    if (idx >= 0) {
      g.ui.chooseReward(idx);
      updates = 0; frames(240);
      assert('click path: state returns to playing', g.state === 'playing', g.state);
      assert('click path: frames keep running', updates > 200, updates);
    } else {
      log('click path: no trail/perk card rolled (skipping)', true, opts.map(o => o.kind).join(','));
    }

    /* =========================================================================
     * 6. COMBINATIONS (PERK + 3 TRAILS)
     * ========================================================================= */
    for (const combo of [

      pv.vignetteEl.classList.contains('medic-heal'));
    // Player outside field clears medic-heal
    P.position.set(medState.fieldPos.x + 10, 0, medState.fieldPos.z + 10);
    pv.update(0.016);
    assert('Medic: player outside field clears medic-heal vignette',
      !pv.vignetteEl.classList.contains('medic-heal'));
    // Expiration cleanup
    medState.fieldT = 0;
    pv.update(0.016);
    assert('Medic: field expiration cleanly hides 3D station mesh',
      pv.medicGroup.visible === false);

    // 6. GRAVITY Visuals
    g.build.equipPerk('gravity');
    g.activatePerk();
    const gravState = g.build.perkState;
    assert('Gravity: activation spawns 3D singularity with accretion rings and vortex',
      gravState.pulseT > 0 && pv.gravityGroup.visible === true &&
      !!pv.gravityCore && !!pv.gravRing1 && !!pv.gravRing2 && !!pv.gravVortex);
    pv.update(0.016);
    assert('Gravity: accretion rings and ground vortex actively spin during pull phase',
      pv.gravRing1.rotation.z !== 0 || pv.gravRing2.rotation.z !== 0);
    // Singularity burst
    gravState.pulseT = 0;
    pv.onGravityBurst(gravState.pulsePos);
    assert('Gravity: burst triggers expanding shockwave blast mesh',
      pv._gravBlastT > 0 && pv.gravBlast.material.opacity > 0);
    pv.update(0.26);
    assert('Gravity: burst expansion finishes and singularity cleanly hides',
      pv._gravBlastT <= 0 && pv.gravityGroup.visible === false);

    // 7. ENGINEER Visuals
    g.build.equipPerk('engineer');
    g.activatePerk();
    const engState = g.build.perkState;
    const turret = engState.turret;
    assert('Engineer: activation spawns 3D sentry turret with tripod and barrel',
      !!turret && !!turret.mesh && turret.mesh.parent === g.scene &&
      !!turret.barrel && !!turret.led && !!turret.flash);
    assert('Engineer: deployment unfolding animation starts (scale y < 1.0)',
      turret.deployT > 0 && turret.mesh.scale.y < 1.0);
    // Idle scan sweep with green LED
    g.enemies = []; // no enemies
    g.updateTurret(turret, 0.4);
    assert('Engineer: idle scanning displays green LED (0x4dff9b)',
      turret.led.material.color.getHex() === 0x4dff9b);
    // Target acquisition with red LED and firing
    const mockTarget = { alive: true, spawnT: 2, position: new THREE.Vector3(turret.mesh.position.x + 5, 0, turret.mesh.position.z), chestY: 1.2, takeDamage: () => {}, dispose: () => {} };
    g.enemies = [mockTarget];
    turret.cd = 0;
    g.updateTurret(turret, 0.016);
    assert('Engineer: acquired target turns LED alert red (0xff3333) and triggers recoil flash',
      turret.led.material.color.getHex() === 0xff3333 && turret.flashT > 0 && turret.barrel.position.z > -0.32);
    // Turret shutdown and removal
    g.removeTurret(turret);
    g.enemies = [];
    assert('Engineer: destruction/shutdown cleanly removes mesh and disposes materials',
      turret.mesh === null);

    // 8. Reset and Death Cleanup across all perks
    g.reset();
    assert('PerkVisualSystem: g.reset() cleanly hides all 3D perk meshes and DOM overlays',
      pv.katanaGroup.visible === false && pv.medicGroup.visible === false &&
      pv.gravityGroup.visible === false && pv.visorEl.classList.contains('hidden') &&
      pv.maskBreakOverlay.classList.contains('hidden') &&
      pv.vignetteEl.className === 'perk-vignette' && pv._origWeaponMats.size === 0);
    assert('First-person camera and weapon transforms finite after perk actions', finite());

    /* =========================================================================
     * 11. EXECUTIONER MASK MANUAL TOGGLE & DURABILITY REGRESSION SUITE
     * ========================================================================= */
    g.build.equipPerk('executioner');
    const ex = g.build.perkState;
    assert('Executioner starts in OFF state with 100% durability',
      ex.maskState === 'OFF' && ex.mask === 100 && pv.visorEl.classList.contains('hidden'));

    // Test 1: F equips mask
    const eq1 = g.activatePerk();
    assert('F equips mask: state is EQUIPPED, visor visible, no cooldown',
      eq1 === true && ex.maskState === 'EQUIPPED' && !pv.visorEl.classList.contains('hidden') && (ex.cd || 0) === 0);

    // Test 2: F removes mask immediately (No cooldown)
    const eq2 = g.activatePerk();
    assert('F removes mask immediately: state is OFF, visor hidden, no cooldown',
      eq2 === true && ex.maskState === 'OFF' && pv.visorEl.classList.contains('hidden') && (ex.cd || 0) === 0);

    // Test 3: Can freely re-equip immediately
    const eq3 = g.activatePerk();
    assert('No manual toggle cooldown: can immediately re-equip mask',
      eq3 === true && ex.maskState === 'EQUIPPED' && !pv.visorEl.classList.contains('hidden'));

    // Test 4: Accumulate dogtags and damage bonus while EQUIPPED
    g.build.onKill({});
    g.build.onKill({});
    assert('Kills while EQUIPPED grant dogtags and damage bonus (+8%)',
      ex.dogtags === 2 && ex.damageBonus === 2 && Math.abs(g.build.dogtagDamageBonus() - 1.08) < 0.001);

    // Test 5: Manual unequip resets damage bonus, keeps dogtags, disables tracking
    g.activatePerk(); // toggle OFF
    assert('Manual unequip resets damage bonus to 0 (multiplier = 1.0)',
      ex.maskState === 'OFF' && ex.damageBonus === 0 && g.build.dogtagDamageBonus() === 1.0);
    assert('Dogtags remain after manual unequip',
      ex.dogtags === 2);
    assert('Manual unequip disables tracking markers',
      g.enemyMarkers.every(m => m.style.display === 'none'));

    // Test 6: Re-equipping does NOT restore previous damage bonus
    g.activatePerk(); // toggle EQUIPPED
    assert('Re-equipping mask starts fresh (damage bonus = 0, multiplier = 1.0)',
      ex.maskState === 'EQUIPPED' && ex.damageBonus === 0 && g.build.dogtagDamageBonus() === 1.0);

    // Test 7: Incoming damage reduces mask durability
    P.invuln = 0;
    const durBefore = ex.mask;
    P.damage(20, 'test enemy', g);
    assert('Mask durability decreases from incoming damage',
      ex.mask < durBefore, 'durability=' + ex.mask);

    // Test 8: Durability reaches 0 forces mask break
    P.invuln = 0;
    P.maxHealth = 500;
    P.health = 500;
    P.damage(120, 'heavy hit', g); // reduces mask by 96 (from 84), forcing mask to 0%
    assert('Durability reaches 0: mask automatically forced OFF, state is BROKEN',
      ex.mask === 0 && ex.maskState === 'BROKEN' && pv.visorEl.classList.contains('hidden'));
    assert('TAKE OFF MASK warning and screen blocking overlay appear',
      !pv.maskBreakOverlay.classList.contains('hidden') &&
      pv.maskBreakOverlay.querySelector('.mbo-title').textContent.includes('TAKE OFF MASK'));
    assert('Dogtags reset to 0 after forced break',
      ex.dogtags === 0);
    assert('Damage bonus resets to 0 after forced break',
      ex.damageBonus === 0 && g.build.dogtagDamageBonus() === 1.0);
    assert('F cannot equip mask while BROKEN',
      g.activatePerk() === false && ex.maskState === 'BROKEN');

    // Test 9: Automatic transition to REPAIRING after broken timer
    g.build.update(1.5); // step past brokenTimer (1.4s)
    assert('Repair begins automatically: state is REPAIRING, blocking overlay removed',
      ex.maskState === 'REPAIRING' && pv.maskBreakOverlay.classList.contains('hidden'));
    assert('F cannot bypass repairing state',
      g.activatePerk() === false && ex.maskState === 'REPAIRING');

    // Test 10: Mask cannot be equipped below 50%
    ex.mask = 49.0;
    g.build.update(0.016);
    assert('Mask cannot be equipped below 50% (durability 49%)',
      ex.maskState === 'REPAIRING' && g.activatePerk() === false);

    // Test 11: Mask becomes equipable at exactly 50%
    ex.mask = 50.0;
    g.build.update(0.016);
    assert('Mask becomes equipable at exactly 50%: state is READY',
      ex.maskState === 'READY');
    const eqReady = g.activatePerk();
    assert('F equips mask from READY state at 50% durability',
      eqReady === true && ex.maskState === 'EQUIPPED' && ex.mask >= 50);

    // Test 12: No duplicate DOM nodes/listeners/timers after repeated cycles
    const domCountBefore = document.body.querySelectorAll('*').length;
    for (let c = 0; c < 10; c++) {
      g.activatePerk(); // OFF
      g.activatePerk(); // EQUIPPED
    }
    const domCountAfter = document.body.querySelectorAll('*').length;
    assert('No duplicate DOM nodes after 10 toggle cycles',
      domCountBefore === domCountAfter);

    /* =========================================================================
     * 12. SAMURAI SLASH RECOVERY BY DOGTAGS REGRESSION SUITE
     * ========================================================================= */
    P.maxHealth = 100;
    P.health = 100;
    P.alive = true;
    g.build.equipPerk('samurai');
    const sam = g.build.perkState;
    assert('Samurai starts with slashRecovery = 1.0 (100%)',
      sam.slashRecovery === 1.0);

    // Test 1: Slash works when recovery = 100%
    const sl1 = g.activatePerk();
    assert('Slash works when recovery = 100%',
      sl1 === true && sam.slash > 0);
    assert('Slash puts recovery below 100%',
      sam.slashRecovery === 0.0);
    assert('Cannot slash again while recovering',
      g.activatePerk() === false);

    // Test 2: 0 dogtags uses slow recovery rate
    sam.dogtags = 0;
    const rate0 = SP.getSamuraiRecoveryRate(0);
    assert('0 dogtags uses slow recovery rate (~0.67/s, 1.50s total)',
      Math.abs(rate0 - (1 / 1.50)) < 0.01);

    // Test 3: 1-2 dogtags remain in slow recovery range
    const rate1 = SP.getSamuraiRecoveryRate(1);
    const rate2 = SP.getSamuraiRecoveryRate(2);
    assert('1-2 dogtags remain in slow recovery range (1.20s - 1.35s duration)',
      Math.abs(rate1 - (1 / 1.35)) < 0.01 && Math.abs(rate2 - (1 / 1.20)) < 0.01);

    // Test 4: More than 3 dogtags recover significantly faster
    const rate3 = SP.getSamuraiRecoveryRate(3);
    const rate4 = SP.getSamuraiRecoveryRate(4);
    assert('More than 3 dogtags recover significantly faster (rate4 > 1.7x rate0)',
      rate4 > rate0 * 1.7 && rate3 > rate2);

    // Test 5: Recovery speed increases monotonically with dogtag count
    let mono = true;
    for (let d = 0; d < 9; d++) {
      if (SP.getSamuraiRecoveryRate(d + 1) <= SP.getSamuraiRecoveryRate(d)) mono = false;
    }
    assert('Recovery speed strictly increases with dogtag count (0 to 9)', mono);

    // Test 6: 10 dogtags instantly restores slash recovery to 100%
    sam.dogtags = 10;
    sam.slash = 0;
    sam.slashRecovery = 1.0;
    const sl10 = g.activatePerk();
    assert('10 dogtags instantly restores slash recovery to 100%',
      sl10 === true && sam.slashRecovery === 1.0);
    const sl10_2 = g.activatePerk();
    assert('10 dogtags allows consecutive slashes without waiting',
      sl10_2 === true && sam.slashRecovery === 1.0);

    // Test 7: Slash HUD matches real gameplay recovery state
    sam.dogtags = 0;
    sam.slashRecovery = 0.45;
    let stHud = g.build.perkStatus();
    assert('Slash HUD shows SLASH RECOVERY 45% when recovering',
      stHud.label === 'SLASH RECOVERY' && stHud.text === '45%');
    sam.slashRecovery = 1.0;
    stHud = g.build.perkStatus();
    assert('Slash HUD shows SLASH READY when recovery reaches 100%',
      stHud.label === 'SLASH READY');

    // Test 8: Dogtag maximum remains 10
    for (let k = 0; k < 15; k++) g.build.onKill({});
    assert('Dogtag maximum strictly capped at 10',
      sam.dogtags === 10);

    // Test 9: Soul Heal still works
    sam.slash = 0;
    sam.healCd = 0;
    P.health = Math.min(50, P.maxHealth - 30);
    g._healToken = 0;
    const healed = g.holdPerk(0.016);
    assert('Soul Heal still works: spends 1 dogtag and restores HP',
      healed === true && sam.dogtags === 9 && P.health > 50);

    // Test 10: No leaks after repeated slashes
    for (let s = 0; s < 20; s++) {
      sam.slashRecovery = 1.0;
      g.activatePerk();
      g.build.update(0.016);
    }
    assert('No listener/DOM leaks after repeated slashes, transforms finite',
      finite());

    assert('no runtime errors', errors.length === 0, errors.length);
    errors.slice(0, 5).forEach(e => L.push('   ' + e));
  } catch (err) { L.push('THREW ' + (err.stack || err)); }

  const o = document.createElement('pre'); o.id = 'testout';
  o.textContent = '\n===TESTSTART===\n' + L.join('\n') + '\n===TESTEND===\n';
  document.body.appendChild(o);
})();
</script></body></html>
